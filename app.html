<title>Кооп Cucumber — путь</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiny5&family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Cozy wooden pixel-RPG HUD. All art is drawn in code (see SPRITES in the script): wooden and parchment frames are
   9-slice SVGs set as CSS variables, icons and islands are pixel maps. One art pixel is 3 CSS px on panels, 2 on slots.
   Motion is stepped (steps()) at roughly 8-12 frames a second, presses squash by 2-3 px; everything stops under
   prefers-reduced-motion. Layout: sticky HUD on top, the view in the middle, the hotbar fixed at the bottom. */
:root{
  --bg:#5d5568;--bg-2:#4b4456;--bg-3:#3a3443;
  --ink:#3b1f16;--ink-2:#6b4430;--ink-3:#93705a;
  --cream:#f4e6c8;--cream-2:#dcc59a;--cream-hi:#fffaf0;
  --wood:#8b4c2c;--wood-hi:#b0683c;--wood-lo:#5e301d;--wood-dk:#3b1f16;
  --leaf:#5fa646;--leaf-hi:#9ad66f;--leaf-lo:#3d7a33;
  --red:#d8463f;--red-lo:#8f2b2b;--gold:#f1c24c;--gold-lo:#b8812a;--key:#8e8a98;
  --p0:#6db653;--p1:#4f9bd8;--p2:#e3b53c;--p3:#a77fe0;--p4:#e0604b;
  --grain:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 15px,rgba(59,31,22,.22) 15px 18px);
  --paper:radial-gradient(circle at 20% 15%,rgba(255,255,255,.35),rgba(255,255,255,0) 40%),radial-gradient(circle at 85% 90%,rgba(176,104,60,.12),rgba(0,0,0,0) 45%);
  --px:"Tiny5","Rubik",system-ui,sans-serif;--ui:"Rubik","Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --hb:72px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-synthesis-weight:none;-webkit-text-size-adjust:100%}
html,body{margin:0}
body{min-height:100vh;color:var(--cream);font:15px/1.5 var(--ui);
  background:radial-gradient(ellipse 120% 70% at 50% 0%,#6e6680 0%,var(--bg) 45%,var(--bg-2) 80%,var(--bg-3) 100%) fixed var(--bg)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:linear-gradient(45deg,rgba(0,0,0,.07) 25%,transparent 25%,transparent 75%,rgba(0,0,0,.07) 75%),linear-gradient(45deg,rgba(0,0,0,.07) 25%,transparent 25%,transparent 75%,rgba(0,0,0,.07) 75%);
  background-size:6px 6px;background-position:0 0,3px 3px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
[hidden]{display:none!important}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
svg.spr,img.pix{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
h1,h2,h3,p{margin:0}
a{color:var(--gold)}
.px{font-family:var(--px);font-weight:400;letter-spacing:.04em}
.muted{color:var(--ink-3)}

/* ---- frames (9-slice pixel art, set from the script) ---- */
.fr-wood{border:12px solid transparent;border-image:var(--f-wood) 4 / 12px stretch;background:var(--grain),var(--wood);background-clip:padding-box;color:var(--cream)}
.fr-wood-s{border:8px solid transparent;border-image:var(--f-wood) 4 / 8px stretch;background:var(--grain),var(--wood);background-clip:padding-box}
.fr-parch{border:12px solid transparent;border-image:var(--f-parch) 4 / 12px stretch;background:var(--paper),var(--cream);background-clip:padding-box;color:var(--ink)}
.fr-slot{border:6px solid transparent;border-image:var(--f-slot) 3 / 6px stretch;background:var(--cream);background-clip:padding-box;color:var(--ink)}
.fr-inset{border:6px solid transparent;border-image:var(--f-inset) 3 / 6px stretch;background:#2a1712;background-clip:padding-box}
.fr-sign{border:8px solid transparent;border-image:var(--f-sign) 4 / 8px stretch;background:var(--grain),var(--wood-hi);background-clip:padding-box;color:var(--cream-hi)}

/* ---- dust in the air ---- */
#dust{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#dust i{position:absolute;bottom:-10px;left:var(--x);width:3px;height:3px;background:rgba(255,236,210,.5);
  animation:rise var(--t) steps(120) var(--d) infinite}
#dust i:nth-child(3n){width:6px;height:6px;background:rgba(255,236,210,.18)}
@keyframes rise{0%{transform:translate(0,0)}25%{transform:translate(9px,-28vh)}50%{transform:translate(-6px,-56vh)}75%{transform:translate(6px,-84vh)}100%{transform:translate(0,-112vh)}}

/* ---- HUD ---- */
#hud{position:sticky;top:0;z-index:20;margin:0 auto;max-width:860px;padding:calc(6px + env(safe-area-inset-top,0px)) 8px 0}
.hud{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"pt nm lv" "bars bars bars";gap:6px 10px;align-items:center;padding:6px 8px 8px;position:relative}
.hud.in{animation:dropin .5s steps(5) both}
@keyframes dropin{0%{transform:translateY(-110%)}60%{transform:translateY(6px)}100%{transform:translateY(0)}}
.portrait{grid-area:pt;position:relative;width:60px;height:60px;display:grid;place-items:center}
.portrait img,.portrait .ini{width:40px;height:40px}
.ini{display:grid;place-items:center;font:24px var(--px);background:var(--pc,#6db653);color:#fff;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25),inset 0 4px 0 rgba(255,255,255,.25)}
.portrait:active{transform:translateY(2px)}
.portrait.flip{animation:flip .36s steps(4)}
@keyframes flip{0%{transform:scaleX(1)}50%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.key{position:absolute;top:-6px;right:-6px;min-width:18px;padding:1px 3px 2px;font:13px/1 var(--px);color:#fff;background:var(--key);text-align:center;
  box-shadow:0 0 0 2px var(--wood-dk),inset 0 -2px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.3);z-index:2}
.who{grid-area:nm;min-width:0;display:flex;flex-direction:column;gap:2px}
.who b{font:22px/1 var(--px);color:var(--cream-hi);text-shadow:2px 2px 0 var(--wood-dk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font:13px/1.2 var(--px);letter-spacing:.06em;color:var(--gold);text-transform:uppercase}
.plaque{grid-area:lv;position:relative;min-width:84px;height:46px;padding:0 10px;display:flex;align-items:center;justify-content:center;gap:6px;overflow:hidden}
.plaque span{font:16px/1 var(--px);color:var(--cream-2)}
.plaque b{font:28px/1 var(--px);color:var(--cream-hi);text-shadow:2px 2px 0 var(--wood-dk)}
.plaque::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:30%;background:linear-gradient(90deg,transparent,rgba(255,250,230,.45),transparent);transform:skewX(-20deg);animation:shine 4.8s steps(16) 1.2s infinite}
@keyframes shine{0%{left:-40%}25%,100%{left:130%}}
.bars{grid-area:bars;display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.bg{display:flex;flex-direction:column;gap:4px;min-width:0}
.pips{display:flex;gap:3px}
.bg.r .pips{justify-content:flex-end}
.pip{position:relative;display:block}
.pip.cur{animation:wiggle 1.2s steps(2) infinite}
@keyframes wiggle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.brow{display:flex;align-items:center;gap:6px;min-width:0}
.bg.r .brow{flex-direction:row-reverse}
.brow .num{font:14px/1 var(--px);color:var(--cream-hi);white-space:nowrap;text-shadow:2px 2px 0 var(--wood-dk)}
.beat{animation:beat 1.6s steps(1) infinite}
@keyframes beat{0%,70%,100%{transform:scale(1)}76%,88%{transform:scale(1.18)}82%{transform:scale(1.05)}}

/* segmented bars */
.bar{flex:none;min-width:0;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:2px;padding:3px;height:22px;margin:3px;background:#2a1712;box-shadow:0 0 0 3px var(--wood-dk),inset 0 3px 0 rgba(0,0,0,.4)}
.brow .bar{flex:1}
.bar i{background:#4a2c25;box-shadow:inset 0 -3px 0 rgba(0,0,0,.28)}
.bar.red i.on{background:var(--red);box-shadow:inset 0 3px 0 #f17a6f,inset 0 -3px 0 var(--red-lo)}
.bar.gold i.on{background:var(--gold);box-shadow:inset 0 3px 0 #ffe593,inset 0 -3px 0 var(--gold-lo)}
.bar.green i.on{background:var(--leaf);box-shadow:inset 0 3px 0 var(--leaf-hi),inset 0 -3px 0 var(--leaf-lo)}
.bar i.pop{animation:segpop .3s steps(3)}
@keyframes segpop{0%{transform:scaleY(.2)}50%{transform:scaleY(1.35)}100%{transform:scaleY(1)}}

/* ---- main ---- */
main{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:12px 10px calc(var(--hb) + 40px + env(safe-area-inset-bottom,0px))}
#view{display:flex;flex-direction:column;gap:14px}
#view.enter>*{animation:rise-in .42s steps(5) both;animation-delay:calc(var(--i,0) * 60ms)}
@keyframes rise-in{0%{opacity:0;transform:translateY(18px)}60%{opacity:1;transform:translateY(-3px)}100%{opacity:1;transform:translateY(0)}}
.signh{align-self:flex-start;display:flex;align-items:center;gap:8px;padding:2px 10px 4px;font:18px/1.2 var(--px);letter-spacing:.06em;text-transform:uppercase;text-shadow:2px 2px 0 var(--wood-dk);position:relative}
.signh::before,.signh::after{content:"";position:absolute;top:50%;width:6px;height:6px;margin-top:-3px;background:#d9c8a6;box-shadow:0 0 0 2px var(--wood-dk)}
.signh::before{left:-1px}.signh::after{right:-1px}
.card{padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font:26px/1.1 var(--px);color:var(--ink)}
.card h3{font:20px/1.2 var(--px);color:var(--ink)}
.eyebrow{font:14px/1.2 var(--px);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.ribbon{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:4px 10px 5px;font:14px/1 var(--px);letter-spacing:.08em;text-transform:uppercase;color:var(--cream-hi);background:var(--red);
  box-shadow:0 0 0 3px var(--wood-dk),inset 0 3px 0 #f17a6f,inset 0 -3px 0 var(--red-lo)}
.ribbon.gold{background:var(--gold);color:var(--ink);box-shadow:0 0 0 3px var(--wood-dk),inset 0 3px 0 #ffe593,inset 0 -3px 0 var(--gold-lo)}
.ribbon.green{background:var(--leaf);box-shadow:0 0 0 3px var(--wood-dk),inset 0 3px 0 var(--leaf-hi),inset 0 -3px 0 var(--leaf-lo)}
.ribbon.gray{background:#7d7887;box-shadow:0 0 0 3px var(--wood-dk),inset 0 3px 0 #a19cab,inset 0 -3px 0 #57525f}
.sec{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start}
.sec b{display:block;font:14px/1.3 var(--px);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.sec p{color:var(--ink)}
.how{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.how li{position:relative;padding-left:20px;color:var(--ink-2)}
.how li::before{content:"";position:absolute;left:4px;top:.55em;width:6px;height:6px;background:var(--gold);box-shadow:0 0 0 2px var(--wood-dk)}
.prog{display:flex;flex-direction:column;gap:6px}
.prog span{font:14px/1.3 var(--px);letter-spacing:.04em;color:var(--ink-2)}
.note{padding:8px 10px;font-size:14px;color:var(--ink-2);background:rgba(176,104,60,.12);box-shadow:inset 3px 0 0 var(--wood-hi)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 12px 3px;font:18px/1 var(--px);letter-spacing:.06em;text-transform:uppercase;color:#fff;
  border:12px solid transparent;border-image:var(--f-btn) 4 / 12px stretch;background:var(--leaf);background-clip:padding-box;text-shadow:2px 2px 0 var(--leaf-lo);transition:transform .08s steps(1)}
.btn:hover{filter:brightness(1.08)}
.btn:active,.btn.down{transform:translateY(3px);border-image-source:var(--f-btn-down)}
.btn.wood{border-image-source:var(--f-wbtn);background:var(--wood-hi);text-shadow:2px 2px 0 var(--wood-dk)}
.btn.wood:active{border-image-source:var(--f-wbtn-down)}
.btn[disabled]{filter:grayscale(.6);cursor:default}
.btn.cta{align-self:stretch;position:relative;overflow:hidden}
.btn.cta::after{content:"";position:absolute;top:-10px;bottom:-10px;left:-30%;width:18%;background:rgba(255,255,255,.35);transform:skewX(-20deg);animation:shine 3.6s steps(12) infinite}
.dots i{display:inline-block;width:6px;height:6px;margin:0 2px;background:#fff;animation:dot .6s steps(2) infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:2px 10px 4px;font:15px/1 var(--px);letter-spacing:.04em;color:var(--ink);
  border:6px solid transparent;border-image:var(--f-slot) 3 / 6px stretch;background:var(--cream);background-clip:padding-box;transition:transform .08s steps(1)}
.chip[aria-pressed="true"]{background:#ffe7a6;transform:translateY(-3px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.chip:active{transform:translateY(2px)}
.chip .dot{width:10px;height:10px;background:var(--pc);box-shadow:0 0 0 2px var(--wood-dk)}
.chip img{width:20px;height:20px}

/* ---- path ---- */
.skybox{padding:0;position:relative}
.sky{overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:#b0683c #3b1f16;
  background:linear-gradient(180deg,#141a3a 0 22%,#1b2450 22% 44%,#253262 44% 64%,#33427a 64% 82%,#46548e 82% 100%)}
.sky svg{display:block;height:250px}
.sky .tw{animation:tw 2.4s steps(2) infinite}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}
.sky .cloud{animation:drift 90s steps(360) infinite}
@keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(420px)}}
.sky .march{animation:march 1s steps(4) infinite}
@keyframes march{to{stroke-dashoffset:-16}}
.isl{cursor:pointer;outline:none}
.sky.intro .isl{animation:isl-in .36s steps(4) both;animation-delay:calc(var(--k) * 70ms + 120ms)}
@keyframes isl-in{0%{opacity:0;transform:translateY(24px)}70%{opacity:1;transform:translateY(-4px)}100%{opacity:1;transform:translateY(0)}}
.sky.intro .walk{stroke-dasharray:1 1;stroke-dashoffset:1;animation:draw .5s steps(6) forwards;animation-delay:calc(var(--k) * 90ms + 200ms)}
@keyframes draw{to{stroke-dashoffset:0}}
.isl .body{animation:bob 2.4s steps(2) infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.isl.hop .body{animation:hop .45s steps(5)}
@keyframes hop{0%{transform:scale(1,1)}25%{transform:scale(1.15,.82)}55%{transform:scale(.92,1.14) translateY(-9px)}80%{transform:scale(1.04,.96)}100%{transform:scale(1,1)}}
.isl .spk{animation:spk 1.2s steps(2) infinite}
@keyframes spk{0%,100%{opacity:1}50%{opacity:0}}
.isl .fl2{animation:flag .5s steps(1) infinite}
.isl .fl1{animation:flag .5s steps(1) infinite reverse}
@keyframes flag{0%{opacity:1}50%{opacity:0}100%{opacity:1}}
.isl .mark{animation:mark .7s steps(2) infinite}
@keyframes mark{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.isl .sel{animation:blink 1s steps(2) infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.55}}
.isl:hover .body,.isl:focus-visible .body{filter:brightness(1.15)}
.lbl{font:15px var(--px);fill:#e7ecf7}
.lbl.on{fill:#fff6c9}
.stg{font:15px var(--px);fill:var(--cream-hi)}
.pathbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px}
.pathbar .heads{display:flex;flex-wrap:wrap;gap:6px}
.upd{text-align:center;font-size:13px;color:#c9c1d3}
.obsline{display:none}

/* ---- coop / done / lists ---- */
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.pc{flex-direction:row;align-items:center;gap:12px}
.pc .face{flex:none;width:64px;height:64px;display:grid;place-items:center}
.pc .face img,.pc .face .ini{width:44px;height:44px}
.pc .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.pc .meta b{font:20px/1.1 var(--px);color:var(--ink)}
.pc .meta span{font-size:13px;color:var(--ink-2)}
.goal{display:flex;flex-direction:column;gap:6px}
.goal .gh{display:flex;align-items:center;gap:8px;font:15px/1.2 var(--px);letter-spacing:.04em;color:var(--ink)}
.goal .gv{font-size:14px;color:var(--ink-2)}
.chestbox{align-items:center;text-align:center;gap:6px}
.chestbox .big{display:grid;justify-items:center;align-items:end}
.chestbox .big>*{grid-area:1/1}
.chestbox .c1{visibility:hidden;animation:vis-out .5s steps(1) .25s both}
.chestbox .c2{animation:vis-in .5s steps(1) .25s both}
.chestbox .big{animation:hop .45s steps(5) .7s}
@keyframes vis-out{0%{visibility:visible}100%{visibility:hidden}}
@keyframes vis-in{0%{visibility:hidden}100%{visibility:visible}}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.items li{display:flex;align-items:center;gap:10px;padding:4px 8px;background:rgba(176,104,60,.10);box-shadow:inset 0 -2px 0 rgba(59,31,22,.15)}
.items li .nm{flex:1;min-width:0;color:var(--ink)}
.items li .nm small{color:var(--ink-3)}
.items time{font:13px var(--px);color:var(--ink-3);white-space:nowrap}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:6px}
.kv div{padding:6px 8px;background:rgba(176,104,60,.10)}
.kv dt{font:12px var(--px);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.kv dd{margin:0;color:var(--ink);font-weight:600}
details.card summary{cursor:pointer;font:16px var(--px);letter-spacing:.04em;color:var(--ink);list-style:none}
details.card summary::before{content:"▸ ";color:var(--wood)}
details.card[open] summary::before{content:"▾ "}

/* quests */
.tools{padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:8px;padding:2px 10px;color:var(--ink)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:16px var(--ui);padding:8px 0;outline:none}
.search input::placeholder{color:var(--ink-3)}
.dd{appearance:none;-webkit-appearance:none;align-self:flex-start;max-width:100%;border:6px solid transparent;border-image:var(--f-slot) 3 / 6px stretch;background:var(--cream);background-clip:padding-box;color:var(--ink);font:15px var(--px);padding:6px 12px}
.stage{display:flex;flex-direction:column;gap:10px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px;align-items:start}
.q .qh{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.q .qh h3{font:19px/1.15 var(--px)}
.meta{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;font-size:14px}
.meta dt{font:12px/1.6 var(--px);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.meta dd{margin:0;color:var(--ink)}
.steps{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
.steps li::marker{font-family:var(--px);color:var(--wood)}
.rw{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.marks{display:flex;flex-wrap:wrap;gap:6px}
.mk{display:inline-flex;align-items:center;gap:5px;padding:2px 7px 3px;font:13px/1.2 var(--px);color:var(--ink-3);background:rgba(59,31,22,.08);box-shadow:inset 0 0 0 2px rgba(59,31,22,.18)}
.mk::before{content:"";width:8px;height:8px;background:var(--pc);box-shadow:0 0 0 2px var(--wood-dk);opacity:.5}
.mk.on{color:var(--ink);background:rgba(99,171,70,.22);box-shadow:inset 0 0 0 2px var(--leaf-lo)}
.mk.on::before{opacity:1}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tasks li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:8px 0;border-top:2px dashed rgba(59,31,22,.18)}
.tasks li:first-child{border-top:0}
.tasks b{color:var(--ink)}
.tasks .h{grid-column:1;font-size:14px;color:var(--ink-2)}
.tasks .r{grid-row:1/span 2;grid-column:2;font:12px/1.3 var(--px);color:var(--ink-3);text-align:right;max-width:13em}
.prose{color:var(--ink)}
.prose ul,.prose ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;min-width:420px;font-size:14px;color:var(--ink)}
.tbl th,.tbl td{text-align:left;padding:7px 8px;border-bottom:2px solid rgba(59,31,22,.15)}
.tbl th{font:13px var(--px);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);background:rgba(176,104,60,.12)}
.empty{padding:20px;text-align:center}

/* ---- hotbar ---- */
#hotbar{--slot:clamp(32px,calc((100vw - 68px) / 9),50px);position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;display:flex;align-items:flex-end;gap:3px;padding:4px;max-width:calc(100vw - 8px)}
#hotbar.in{animation:barin .5s steps(5) both}
@keyframes barin{0%{transform:translate(-50%,130%)}70%{transform:translate(-50%,-6px)}100%{transform:translate(-50%,0)}}
.hb{position:relative;width:var(--slot);height:var(--slot);flex:none;display:grid;place-items:center;transition:transform .1s steps(2)}
.hb>span:not(.key){display:grid;place-items:center}
.hb.sel{transform:translateY(-8px);background:#fff3cf}
.hb.sel::after{content:"";position:absolute;inset:-12px;border:12px solid transparent;border-image:var(--f-selbox) 4 / 12px stretch;animation:blink 1s steps(2) infinite;pointer-events:none}
.hb:active{transform:translateY(2px) scale(.96,.92)}
.hb.pulse{animation:hbpulse .36s steps(3)}
@keyframes hbpulse{0%{transform:translateY(-8px) scale(1)}40%{transform:translateY(-12px) scale(1.12,.9)}100%{transform:translateY(-8px) scale(1)}}
.hb .key{top:-9px;left:-9px;right:auto;min-width:16px;font-size:12px}
.hb.sep{margin-left:4px}
.hb.sepr{margin-right:4px}
.hb .badge{position:absolute;bottom:-8px;right:-8px;min-width:18px;height:18px;padding:0 4px;font:13px/18px var(--px);color:#fff;text-align:center;background:var(--red);box-shadow:0 0 0 2px var(--wood-dk),inset 0 -3px 0 var(--red-lo);animation:wiggle 1s steps(2) infinite;z-index:3}
.leaf{position:absolute;pointer-events:none;animation:sway 1.6s steps(1) infinite}
.leaf.b{animation-delay:.8s}
@keyframes sway{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
#itemname{position:fixed;left:50%;bottom:calc(var(--hb) + 24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:31;pointer-events:none;
  font:22px/1 var(--px);letter-spacing:.06em;color:#fff;text-shadow:3px 3px 0 #2a1712;opacity:0;white-space:nowrap}
#itemname.show{animation:iname 1.8s steps(9) forwards}
@keyframes iname{0%{opacity:0;transform:translate(-50%,8px)}12%{opacity:1;transform:translate(-50%,0)}75%{opacity:1}100%{opacity:0}}

/* ---- ask: the co-op's advisor ---- */
.advisor{gap:10px}
.adv{display:flex;align-items:center;gap:12px}
.adv h2{margin-bottom:2px}
.slotbig{flex:none;width:76px;height:76px;display:grid;place-items:center}
.owlbox{display:grid;place-items:center}
.owlbox>span{grid-area:1/1;display:grid;place-items:center}
.owlbox .blink{visibility:hidden;animation:owlblink 4.6s steps(1) infinite}
@keyframes owlblink{0%,90%{visibility:hidden}91%,95%{visibility:visible}96%,100%{visibility:hidden}}
.owlbox.think{animation:bob 1s steps(2) infinite}
.memo summary{cursor:pointer;display:flex;align-items:center;gap:8px;font:15px/1.3 var(--px);letter-spacing:.04em;color:var(--ink);list-style:none}
.memo summary::-webkit-details-marker{display:none}
.memo summary::after{content:"▸";color:var(--wood)}
.memo[open] summary::after{content:"▾"}
.memo[open]>*:not(summary){margin-top:8px}
.chat{display:flex;flex-direction:column;gap:14px}
.pair{display:flex;flex-direction:column;gap:6px}
.msg{display:flex;align-items:flex-end;gap:6px;min-width:0}
.msg.q{justify-content:flex-end;padding-left:34px}
.msg.a{padding-right:14px}
.msg .face{flex:none;width:40px;height:40px;display:grid;place-items:center}
.msg .face img,.msg .face .ini{width:28px;height:28px;font-size:16px}
.bub{min-width:0;padding:4px 8px 6px;font-size:15px;line-height:1.45}
.bub p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.bub .mt{display:block;margin-bottom:2px;font:12px/1.3 var(--px);letter-spacing:.04em;opacity:.85}
.msg.a .bub{color:var(--ink)}
.bub.dim{opacity:.7}
.bub.last p::after,.bub.typing p::after{content:"";display:inline-block;vertical-align:-1px;margin-left:5px;animation:blink 1s steps(2) infinite}
.bub.last p::after{width:10px;height:7px;background:var(--wood);clip-path:polygon(0 0,100% 0,50% 100%)}
.bub.typing p::after{width:8px;height:14px;background:var(--ink-2)}
.dots.ink i{background:var(--ink-2)}
.ask-note{margin:0;padding:10px 4px;text-align:center;color:#d9cfe3}
.sugg{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.sugg.row{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;padding:4px 2px 6px;margin:0 -2px;scrollbar-width:none}
.sugg.row::-webkit-scrollbar{display:none}
.sugg .chip{flex:none;font-size:14px;text-align:left}
.composer{position:sticky;bottom:calc(var(--hb) + 22px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;align-items:flex-end;gap:6px;padding:4px}
.composer .me{flex:none;width:44px;height:44px;display:grid;place-items:center}
.composer .me img,.composer .me .ini{width:28px;height:28px;font-size:16px}
.composer textarea{flex:1;min-width:0;height:44px;min-height:44px;max-height:132px;resize:none;border:6px solid transparent;border-image:var(--f-slot) 3 / 6px stretch;background:var(--cream);background-clip:padding-box;color:var(--ink);font:16px/1.35 var(--ui);padding:5px 8px;outline:none}
.composer textarea::placeholder{color:var(--ink-3)}
.composer .btn{flex:none;min-height:44px;height:44px;padding:0 6px 2px}
#fade{position:fixed;left:0;right:0;bottom:0;height:calc(var(--hb) + 18px + env(safe-area-inset-bottom,0px));z-index:4;pointer-events:none;background:linear-gradient(180deg,rgba(58,52,67,0),rgba(46,41,54,.94) 16px)}
body.asking #fade{height:calc(var(--hb) + 44px + env(safe-area-inset-bottom,0px))}
body.typing #fade{height:calc(28px + env(safe-area-inset-bottom,0px))}
body.typing #hotbar,body.typing #itemname{display:none}
body.typing .composer{bottom:calc(8px + env(safe-area-inset-bottom,0px))}

/* ---- popover, toast, effects ---- */
.wipe{position:fixed;left:0;right:0;z-index:15;display:grid;grid-auto-rows:36px;overflow:hidden;pointer-events:none}
.wipe i{background:#2c2533;box-shadow:inset 0 0 0 3px #352d3e;animation:wipe .18s steps(3) forwards}
@keyframes wipe{0%{transform:scale(1.02)}100%{transform:scale(0)}}
#who-pop{position:fixed;z-index:40;top:calc(78px + env(safe-area-inset-top,0px));left:12px;padding:8px;display:none;flex-direction:column;gap:6px;min-width:220px}
#who-pop.open{display:flex;animation:popin .28s steps(4)}
@keyframes popin{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.05);opacity:1}100%{transform:scale(1)}}
#who-pop button{display:flex;align-items:center;gap:10px;padding:4px 8px;color:var(--ink);font:17px var(--px);text-align:left}
#who-pop button img,#who-pop button .ini{width:28px;height:28px;font-size:16px}
#who-pop button[aria-current="true"]{background:#ffe7a6}
#toast{position:fixed;left:50%;top:calc(var(--hudb,96px) - 6px);z-index:19;transform:translate(-50%,-160%);padding:6px 14px;font:16px var(--px);letter-spacing:.04em;max-width:calc(100vw - 32px);text-align:center;pointer-events:none}
#toast.show{animation:toast 2.6s steps(13) forwards}
@keyframes toast{0%{transform:translate(-50%,-160%)}12%{transform:translate(-50%,8px)}18%,82%{transform:translate(-50%,0)}100%{transform:translate(-50%,-160%)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.spark{position:absolute;width:6px;height:6px;background:var(--c);box-shadow:0 0 0 2px rgba(42,23,18,.6);animation:fly .9s steps(9) forwards}
@keyframes fly{0%{transform:translate(0,0)}60%{opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
.ftext{position:absolute;font:24px var(--px);color:#fff6c9;text-shadow:3px 3px 0 #2a1712;animation:up 1.2s steps(10) forwards;white-space:nowrap}
@keyframes up{0%{transform:translate(-50%,0);opacity:0}15%{opacity:1}100%{transform:translate(-50%,-70px);opacity:0}}
.shake{animation:shake .36s steps(6)}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,2px)}}
#banner{position:fixed;inset:0;z-index:55;display:none;place-items:center;pointer-events:none}
#banner.show{display:grid}
#banner .rays{position:absolute;width:560px;height:560px;background:repeating-conic-gradient(rgba(241,194,76,.28) 0 10deg,transparent 10deg 30deg);border-radius:50%;animation:spin 6s steps(24) infinite;
  -webkit-mask:radial-gradient(circle,#000 30%,transparent 68%);mask:radial-gradient(circle,#000 30%,transparent 68%)}
@keyframes spin{to{transform:rotate(360deg)}}
#banner .ttl{position:relative;padding:10px 22px 12px;font:28px/1.1 var(--px);text-align:center;animation:popin .4s steps(4)}
#banner .ttl small{display:block;font:16px var(--px);color:var(--gold)}

/* ---- OBS overlay (?obs=1): only the path ---- */
body.obs{background:transparent}
body.obs::before,body.obs #dust,body.obs #fade,body.obs #hud,body.obs #hotbar,body.obs #itemname,body.obs .card,body.obs .pathbar,body.obs .upd{display:none!important}
body.obs main{padding:0;max-width:none}
body.obs #view{gap:0}
body.obs .obsline{display:flex;align-items:center;gap:10px;padding:6px 14px 8px;font:16px/1.3 var(--px);color:var(--cream-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media (min-width:760px){
  .hud{grid-template-columns:auto auto minmax(0,1fr) auto minmax(0,1fr);grid-template-areas:"pt nm l lv r";padding:8px 12px 10px}

}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}#dust{display:none}#toast.show{transform:translate(-50%,0)}#itemname.show{opacity:1}}

<script type="application/json" id="data">{"meta":{"source":"hypixelskyblock.minecraft.wiki","asOf":"2026-11-05","wiki":"https://hypixelskyblock.minecraft.wiki/w/"},"quests":[{"id":"fairy-souls","st":0,"c":"g","n":"Find all Fairy Souls","loc":"Все острова","npc":"Tia the Fairy","need":"Доступен сразу","steps":["Собирай Fairy Souls: радужные шары, спрятанные по всем островам. Всего их 289, каждую можно взять один раз.","Отдавай души Tia the Fairy в Wilderness (Hub) по 5 штук. За каждый обмен дают SkyBlock XP, а на обменах №1, 2, 4, 6, 8, 10, 13, 16, 19, 22, 25, 28, 31, 34, 37, 40 и 44 открываются слоты рюкзаков.","Часть душ добывается не на карте: 5 с рыбалки (2-й, 9-й и 24-й улов-сокровище гарантированно души, ещё 2 с шансом 0,5% в Fairy Grotto), до 8 в комнатах данжей, по одной за первый заказ гостей Tia и Bruuh в Garden, одна у Vanguard Corpse в Fairy Mineshaft и одна от Placeable Fairy Soul."],"rw":"SkyBlock XP, слоты рюкзаков","note":"Удобнее всего с модами SkyHanni или Skyblocker: у них есть метки и маршруты по душам. Для труднодоступных мест пригодятся Aspect of the End/Void, Ender Pearl или Grappling Hook. Сколько душ собрано на каждом острове, видно в Quest Log.","en":"Find all Fairy Souls"},{"id":"getting-started","st":1,"c":"g","n":"Getting Started","loc":"Private Island","npc":"Jerry","need":"Доступен сразу","steps":["Сломай Oak Log.","Скрафти Crafting Table.","Скрафти Wooden Pickaxe. Квест засчитается без сообщения в чате.","После этого появится задача поговорить с Jerry, но в квест она уже не входит."],"rw":"—","en":"Getting Started"},{"id":"auctioneer","st":1,"c":"g","n":"Auctioneer","loc":"Auction House (Hub)","npc":"Auction Master","need":"Побывать в Hub","steps":["Поговори с Auction Master в Auction House."],"rw":"—","note":"Квест необязательный: аукционом можно пользоваться и без него.","en":"Auctioneer"},{"id":"saving-up","st":1,"c":"g","n":"Saving Up","loc":"Bank, Village (Hub)","npc":"Banker","need":"Побывать в Hub","steps":["Поговори с Banker в Village: +5 SkyBlock XP.","Положи в банк любые монеты. Квест завершится и даст ещё 10 монет."],"rw":"10 монет, +5 SkyBlock XP","en":"Saving Up"},{"id":"library-card","st":1,"c":"g","n":"Library Card","loc":"Library (Hub)","npc":"Librarian","need":"Побывать в Hub","steps":["Поговори с Librarian в Library: +5 SkyBlock XP и +100 Enchanting XP.","Зачаруй любой предмет. Квест завершится и даст ещё +10 Enchanting XP."],"rw":"110 Enchanting XP, +5 SkyBlock XP","en":"Library Card"},{"id":"marco","st":1,"c":"g","n":"Marco the Artist","loc":"Flower House (Hub)","npc":"Marco","need":"Побывать в Hub","steps":["Поговори с Marco в Flower House.","Сорви 5× Rose Red с цветов у дома и отдай ему.","Он отдаст Spray Can и откроет Canvas Room."],"rw":"Spray Can (предмет и рецепт), доступ в Canvas Room","en":"Marco the Artist"},{"id":"carpentry","st":1,"c":"g","n":"Carpentry","loc":"Foraging Camp (Hub)","npc":"Carpenter","need":"Побывать в Hub","steps":["Поговори с Carpenter в Foraging Camp.","Принеси ему 64× White Wool."],"rw":"Рецепт Carpentry Table, навык Carpentry","en":"Carpentry"},{"id":"hub-explorer","st":1,"c":"g","n":"Hub Explorer","loc":"Весь Hub","npc":"—","need":"Побывать в Hub","steps":["Обойди 13 мест Hub: Auction House, Bank, Library, Village, Colosseum, Coal Mine, Forest, Farm, Graveyard, Wilderness, Mountain, Ruins и Unincorporated."],"rw":"50 монет, +5 SkyBlock XP","en":"Hub Explorer"},{"id":"safety-first","st":2,"c":"g","n":"Safety First","loc":"Community Center, Security Hall (Hub)","npc":"Susan, Brigette, Jimmy, Security Clerk, Elizabeth","need":"SkyBlock Level 10","steps":["Дойди до SkyBlock Level 10.","Поговори с Susan: она откроет вход в Security Hall.","Выполни квест безопасности у Brigette.","Забери Safety Badge у Security Clerk и Booster Cookie у Elizabeth."],"rw":"Safety Badge, Booster Cookie","en":"Safety First"},{"id":"chicken-racing","st":0,"c":"g","n":"Chicken Racing","loc":"Jerry's Workshop","npc":"Gulliver","need":"Побывать в Jerry's Workshop","steps":["Поговори с Gulliver и начни Chicken Race.","Награды за скорость: 1-й чекпоинт быстрее 33 с даёт Red Gift, 2-й быстрее 52 с — Gift Compass, 3-й быстрее 68 с — Frozen Chicken.","Все 4 чекпоинта быстрее 104 с дают Jingle Bells и +5 SkyBlock XP."],"rw":"Red Gift, Gift Compass, Frozen Chicken, Jingle Bells, +5 SkyBlock XP","en":"Chicken Racing"},{"id":"dungeon-hub-racing","st":0,"c":"g","n":"Dungeon Hub Racing","loc":"Dungeon Hub","npc":"Guildford","need":"Побывать в Dungeon Hub","steps":["Поговори с Guildford в Dungeon Hub.","Есть 3 трассы (Crystal Core, Giant Mushrooms, Precursor Ruins), у каждой 4 режима (Anything, No Pearls, No Abilities, Nothing at all) и 4 норматива времени. Всего 96 заездов.","Все нормативы на одной трассе дают Cat Talisman, на двух — Lynx Talisman, на трёх — Cheetah Talisman.","Каждый пройденный норматив даёт Wither Essence, всего до 432."],"rw":"Cat, Lynx и Cheetah Talisman, до 432 Wither Essence","en":"Dungeon Hub Racing"},{"id":"time-to-mine","st":1,"c":"m","n":"Time to Mine","loc":"Mining District, Coal Mine, Gold Mine","npc":"Blacksmith","need":"Побывать в Hub","steps":["Поговори с Blacksmith в Mining District.","Накопай 10× Coal: +100 Mining XP и +5 SkyBlock XP.","Снова поговори с Blacksmith: откроется перековка (Reforge).","Дойди до Gold Mine: +10 Mining XP, квест готов."],"rw":"110 Mining XP, +5 SkyBlock XP","en":"Time to Mine"},{"id":"reforger","st":1,"c":"m","n":"Reforger","loc":"Mining District","npc":"Blacksmith","need":"Показать Blacksmith 10× Coal (квест Time to Mine)","steps":["Перекуй (Reforge) любой предмет у Blacksmith за 10× Coal."],"rw":"150 Mining XP","en":"Reforger"},{"id":"lost-and-found","st":2,"c":"m","n":"Lost and Found","loc":"Gold Mine","npc":"Lazy Miner, Rusty","need":"Побывать в Gold Mine","steps":["Поговори с Lazy Miner в Gold Mine (+5 SkyBlock XP, +150 Mining XP). Он потерял Iron Pickaxe с Efficiency 1 и Smelting Touch 1.","Кирка лежит на координатах −18, 24, −305. Забери её (+10 Mining XP).","Добудь 1× Iron Ingot и 1× Gold Ingot и поговори с Rusty."],"rw":"Iron Pickaxe, 160 Mining XP, +5 SkyBlock XP","en":"Lost and Found"},{"id":"going-deeper","st":2,"c":"m","n":"Going Deeper","loc":"Deep Caverns","npc":"Lift Operator","need":"Побывать в Gold Mine","steps":["Прокачай Mining до 5.","Спустись в Deep Caverns (+15 Mining XP).","Поговори с Lift Operator."],"rw":"15 Mining XP","en":"Going Deeper"},{"id":"helpful-miner","st":2,"c":"m","n":"Helpful Miner","loc":"Lapis Quarry (Deep Caverns)","npc":"Lapis Miner","need":"Побывать в Lapis Quarry","steps":["Поговори с Lapis Miner.","Прокачай коллекцию Lapis Lazuli до III: откроется рецепт Lapis Pickaxe.","Скрафти Lapis Pickaxe и отдай ему. Кирка исчезнет, квест завершится."],"rw":"Compactor, 2 000 монет, 1 000 Mining XP, +5 SkyBlock XP","en":"Helpful Miner"},{"id":"redstone-maniac","st":2,"c":"m","n":"The Redstone Maniac","loc":"Pigmen's Den (Deep Caverns)","npc":"Redstone Miner","need":"Пройти Helpful Miner и вернуться в Lapis Quarry","steps":["Поговори с Redstone Miner.","Прокачай коллекцию Redstone Dust до II.","Отдавай ему 128, 256, 512 и 1 024 Redstone Dust. За каждую партию +1 слот Accessory Bag.","После последней партии квест завершится (+5 SkyBlock XP)."],"rw":"Слоты Accessory Bag, +5 SkyBlock XP","note":"Всего понадобится 1 920 Redstone Dust. Удобно копить заранее: миньон или поход в шахту вдвоём.","en":"The Redstone Maniac"},{"id":"there-are-dwarves","st":3,"c":"m","n":"There are Dwarves?","loc":"Obsidian Sanctuary (Deep Caverns)","npc":"Rhys","need":"Поговорить с Rhys или Mining 12","steps":["Найди Rhys в Obsidian Sanctuary.","Отдай ему 15 зачарованных шахтёрских предметов в любом сочетании: Enchanted Redstone Dust, Enchanted Iron Ingot, Enchanted Coal, Enchanted Emerald, Enchanted Lapis Lazuli, Enchanted Diamond, Enchanted Gold Ingot.","Откроются Dwarven Mines и Heart of the Mountain."],"rw":"Доступ в Dwarven Mines и к Heart of the Mountain","en":"There are Dwarves?"},{"id":"need-to-go-deeper","st":3,"c":"m","n":"We Need to Go Deeper","loc":"Dwarven Mines, Crystal Hollows","npc":"Gwendolyn, Emissary Braum","need":"Heart of the Mountain 4","steps":["Прокачай Heart of the Mountain до 4.","Поговори с Gwendolyn и спустись в Crystal Hollows.","Добудь 10 Ruby Gemstone.","Поговори с Emissary Braum."],"rw":"Доступ в Crystal Hollows","en":"We Need to Go Deeper"},{"id":"trial-of-the-jungle","st":3,"c":"m","n":"Trial of the Jungle","loc":"Jungle, Jungle Temple (Crystal Hollows)","npc":"Kalhuiki Door Guardian","need":"Побывать в Crystal Hollows","steps":["Добудь Jungle Key: он падает с Key Guardian в зоне Jungle, а ещё его продаёт Odawa за 100× Sludge Juice.","Отдай ключ Kalhuiki Door Guardian, войди в Jungle Temple и пройди паркур до Amethyst Crystal.","Добудь 100 Amethyst Gemstone."],"rw":"Amethyst Crystal для Crystal Nucleus","note":"Crystal Nucleus в центре Crystal Hollows (512, Y, 512) открывает сундук с добычей, когда в него вставлены все 5 кристаллов: Jade, Amber, Amethyst, Sapphire и Topaz. Wishing Compass указывает, где искать кристаллы.","en":"Trial of the Jungle"},{"id":"robots","st":3,"c":"m","n":"Now there's Robots?","loc":"Precursor Remnants, Lost Precursor City (Crystal Hollows)","npc":"Professor Robot","need":"Побывать в Crystal Hollows","steps":["Убей 100 Automaton в Precursor Remnants. С них падают Automaton Parts.","Отдай Professor Robot в Lost Precursor City 6 разных деталей: Electron Transmitter, FTX 3070, Robotron Reflector, Superlite Motor, Control Switch и Synthetic Heart. Вместо них подойдёт один Precursor Apparatus.","Добудь 100 Sapphire Gemstone."],"rw":"Sapphire Crystal для Crystal Nucleus","en":"Now there's Robots?"},{"id":"royal-goblins","st":3,"c":"m","n":"Royal Goblins","loc":"Goblin Holdout, Goblin Queen's Den (Crystal Hollows)","npc":"King Yolkar","need":"Побывать в Crystal Hollows","steps":["Отдай King Yolkar в Goblin Holdout 1× Goblin Egg. Он даст эффект King's Scent на 20 минут.","Пока эффект действует, проберись мимо стражи в Goblin Queen's Den и забери Amber Crystal.","Добудь 100 Amber Gemstone."],"rw":"Amber Crystal для Crystal Nucleus","en":"Royal Goblins"},{"id":"divans-quest","st":3,"c":"m","n":"Divan's Quest","loc":"Mines of Divan (Mithril Deposits, Crystal Hollows)","npc":"Keepers of Divan","need":"Побывать в Crystal Hollows","steps":["Войди в Mines of Divan. Первый Keeper выдаст Metal Detector.","Найди детектором 4 Scavenged Items и раздай их хранителям: Lapis Sword — Keeper of Lapis, Golden Hammer — Keeper of Gold, Diamond Axe — Keeper of Diamond, Emerald Hammer — Keeper of Emerald.","Забери Jade Crystal и добудь 100 Jade Gemstone."],"rw":"Jade Crystal для Crystal Nucleus","note":"Пятый кристалл, Topaz, квеста не требует: он появляется после победы над боссом Bal в Khazad-dûm (Magma Fields). Забрать его могут только те, кто участвовал в бою, так что идите всем коопом.","en":"Divan's Quest"},{"id":"beyond-the-wall","st":4,"c":"m","n":"Beyond the Wall","loc":"Hanging Court, The Forge, Dwarven Base Camp","npc":"Dulin, Forger, Ticket Master","need":"Heart of the Mountain 7","steps":["Прокачай Heart of the Mountain до 7.","Поговори с Dulin в Hanging Court: в The Forge откроется рецепт Secret Railroad Pass.","Скуй Secret Railroad Pass и отдай Ticket Master.","Доедь на вагонетке до Dwarven Base Camp."],"rw":"25 000 Mining XP, +5 SkyBlock XP, доступ в Dwarven Base Camp","en":"Beyond the Wall"},{"id":"first-harvest","st":1,"c":"f","n":"First Harvest","loc":"Farm (Hub), The Barn","npc":"Farmer Rigby","need":"Побывать в Hub","steps":["Поговори с Farmer Rigby на Farm.","Собери рядом 10× Wheat и отдай ему: получишь Rookie Hoe, 100 Farming XP и +5 SkyBlock XP.","Дойди до The Barn: ещё 10 Farming XP."],"rw":"Rookie Hoe, 110 Farming XP, +5 SkyBlock XP","en":"First Harvest"},{"id":"barnyard","st":2,"c":"f","n":"Back at the Barnyard","loc":"The Barn","npc":"Farmhand","need":"Побывать в The Barn","steps":["Поговори с Farmhand (+5 SkyBlock XP, +100 Farming XP).","Покажи ему Wheat Minion: получишь Chicken Pet. Экипируй питомца.","Собери Carrot, Potato, Pumpkin и Melon (+10 Farming XP).","Добудь Raw Porkchop, Raw Chicken и Leather (+10 Farming XP)."],"rw":"Chicken Pet, 120 Farming XP, +5 SkyBlock XP","note":"Wheat Minion I крафтится из Wooden Hoe и 8 Wheat.","en":"Back at the Barnyard"},{"id":"intermediate-farmer","st":2,"c":"f","n":"Intermediate Farmer","loc":"The Barn, Mushroom Desert, Oasis","npc":"—","need":"Побывать в The Barn","steps":["Прокачай Farming до 5 (+5 SkyBlock XP, 300 Farming XP).","Дойди до Mushroom Desert (+15 Farming XP).","Собери Sugar Cane, Cocoa Beans и Cactus (+15 Farming XP).","Добудь Raw Mutton и Raw Rabbit (+15 Farming XP)."],"rw":"345 Farming XP, +5 SkyBlock XP","en":"Intermediate Farmer"},{"id":"helpful-farmer","st":2,"c":"f","n":"Helpful Farmer","loc":"The Garden","npc":"Sam","need":"SkyBlock Level 5","steps":["Открой The Garden и зайди туда.","Поговори с Sam и отдай ей 25× Wheat."],"rw":"+5 SkyBlock XP","en":"Helpful Farmer"},{"id":"learning-to-compost","st":2,"c":"f","n":"Learning to Compost","loc":"The Garden","npc":"Sam","need":"Пройти Helpful Farmer","steps":["Поговори с Sam у Composter.","Купи Fuel в SkyMart и заправь им Composter.","Забери готовый Compost."],"rw":"+5 SkyBlock XP","en":"Learning to Compost"},{"id":"prepping-the-plot","st":2,"c":"f","n":"Prepping the Plot","loc":"The Garden","npc":"Sam","need":"Пройти Learning to Compost","steps":["Купи участок (Plot) у Desk.","Расчисть его, ломая блоки, до 100%. Sam заговорит сама, и квест завершится."],"rw":"+5 SkyBlock XP","en":"Prepping the Plot"},{"id":"crop-n-profit","st":2,"c":"f","n":"Crop 'n Profit","loc":"The Garden","npc":"Sam, Jerry","need":"Пройти Prepping the Plot","steps":["Поговори с Sam: она предложит поставить прилавок для гостей (visitor stand).","Принеси ей 100× Wheat. Она вернёт 5× Wheat и откроет прилавок.","Вскоре придёт первый гость, Jerry, и попросит 5× Bread. Выполни заказ."],"rw":"Награды гостя, 50 монет, +5 SkyBlock XP","en":"Crop 'n Profit"},{"id":"gearing-up","st":3,"c":"f","n":"Gearing Up","loc":"The Garden","npc":"Jeff","need":"Пройти Crop 'n Profit и прокачать Garden до 4","steps":["Прокачай Garden до 4 уровня.","Поговори с Jeff и покажи ему Specialized Farming Tool: инструмент под конкретную культуру.","Получишь Cropshot Chip. Используй его, чтобы открыть систему Chips."],"rw":"Cropshot Chip, доступ к Chips, 5 000 Farming XP, +5 SkyBlock XP","en":"Gearing Up"},{"id":"rooting-for-you","st":4,"c":"f","n":"Rooting for You","loc":"The Garden","npc":"Carpenter, Sam","need":"Garden 7","steps":["На Garden 7 к тебе станет приходить гость Carpenter. Выполни его заказ и получи Greenhouse Blueprint.","Отдай чертёж Sam: откроется Greenhouse.","Переделай первый участок в теплицу. Нужно 64× Enchanted Oak Log и 128× Enchanted Sand.","Sam даст Carrot и HydroCan™ 1000. Посади морковь и полей её, она быстро вырастет.","Посади рядом ещё 2× Carrot от Sam, получится мутация Dustgrain. Изучи её с помощью Plant Diagnostics Tool.","Вырасти ещё один Dustgrain из 2× Seeds, собери его и поговори с Sam."],"rw":"Greenhouse и его улучшения, 5 000 монет, 5 000 Farming XP, +5 SkyBlock XP","en":"Rooting for You"},{"id":"shady-jake","st":4,"c":"f","n":"Shady Jake","loc":"The Garden, Glowing Mushroom Cave (Underground Lab)","npc":"Beth, Jake","need":"В Garden приходит гостья Beth","steps":["Принимай заказы Beth в Garden. Первые три раза она рассказывает, что расследует Jake.","После третьего визита копай по координатам 175, 42, −470 в Glowing Mushroom Cave.","После следующего визита встреться там с Beth, туда же придёт Jake.","Дослушай разговор и получи Jake's Plushie."],"rw":"Jake's Plushie, +5 SkyBlock XP","en":"Shady Jake"},{"id":"further-investigate-jake","st":4,"c":"f","n":"Further Investigate Jake","loc":"The Garden, Underground Lab","npc":"Beth, Jake","need":"Пройти Shady Jake, открыть Greenhouse и выполнить 5-й заказ Beth","steps":["Прими новый заказ Beth в Garden.","Встреться с ней в Underground Lab и потяни рычаг на стене.","В новой комнате Jake расскажет про Crop Analyzer. Дослушай его."],"rw":"Доступ к Crop Analyzer, +5 SkyBlock XP","en":"Further Investigate Jake"},{"id":"crop-analyzer","st":4,"c":"f","n":"Introduction to the Crop Analyzer","loc":"Underground Lab","npc":"Jake","need":"Пройти Further Investigate Jake","steps":["Попробуй воспользоваться Crop Analyzer, Jake тебя остановит.","Принеси ему Dustgrain.","Проанализируй Dustgrain в Crop Analyzer."],"rw":"—","en":"Introduction to the Crop Analyzer"},{"id":"fishing-tutorial","st":1,"c":"fi","n":"Fishing Tutorial","loc":"Village (Hub)","npc":"Fisherwoman Enid","need":"Побывать в Hub","steps":["Поговори с Fisherwoman Enid в Village. Она даст Fishing Rod.","Поймай любую рыбу и снова поговори с ней."],"rw":"1 000 монет, 10 Fishing XP, +5 SkyBlock XP","en":"Fishing Tutorial"},{"id":"finding-the-engine","st":2,"c":"fi","n":"Finding the Engine","loc":"Fishing Outpost (Fisherman's Hut)","npc":"Fisherman Gerald, Captain Baha","need":"Пройти Fishing Tutorial, Fishing 5","steps":["Прокачай Fishing до 5 и поговори с Fisherman Gerald.","Вылови Rusty Ship Engine.","Покажи двигатель Gerald и Captain Baha: откроется Ship Navigator.","Поставь двигатель на корабль."],"rw":"64× Fish Bait, 250 Fishing XP, +5 SkyBlock XP, Ship Navigator, доступ в Backwater Bayou","en":"Finding the Engine"},{"id":"one-mans-trash","st":2,"c":"fi","n":"One Man's Trash","loc":"Backwater Bayou","npc":"Junker Joel, Roddy","need":"Пройти Finding the Engine","steps":["Доплыви до Backwater Bayou через Ship Navigator.","Поговори с Junker Joel, он даст Junk Sinker.","Поговори с Roddy и поставь Junk Sinker на удочку."],"rw":"50 Fishing XP, +5 SkyBlock XP, ещё 200 Fishing XP за попутные задания Глав","en":"One Man's Trash"},{"id":"hotspotting","st":2,"c":"fi","n":"Hotspotting","loc":"Backwater Bayou","npc":"Hattie","need":"Побывать на Backwater Bayou","steps":["Поговори с Hattie: она расскажет про Fishing Hotspots.","Порыбачь в хотспоте, который появится у неё за спиной, и снова поговори с ней."],"rw":"1 000 монет, 100 Fishing XP, +5 SkyBlock XP, ещё 100 Fishing XP за задание Главы","en":"Hotspotting"},{"id":"foraging-tutorial","st":1,"c":"fo","n":"Foraging Tutorial","loc":"Foraging Camp (Hub)","npc":"Lumber Jack","need":"Побывать в Hub","steps":["Поговори с Lumber Jack. Он даст 50 Foraging XP, чтобы открыть Foraging 1.","Наруби 20× Oak Log и принеси ему."],"rw":"Promising Axe, 1 000 монет, 150 Foraging XP, +5 SkyBlock XP, доступ в The Park","en":"Foraging Tutorial"},{"id":"into-the-woods","st":2,"c":"fo","n":"Into the Woods","loc":"Birch Park (The Park)","npc":"Charlie","need":"Пройти Foraging Tutorial","steps":["Поговори с Charlie и принеси ему 64× Birch Log. Получишь Charlie's Trousers.","Поговори с ним ещё раз, и квест завершится."],"rw":"Charlie's Trousers, Travel Scroll to The Park, 1 000 монет, 250 Foraging XP, +5 SkyBlock XP, доступ в Spruce Woods","en":"Into the Woods"},{"id":"helping-hand","st":2,"c":"fo","n":"A Helping Hand","loc":"Spruce Woods (The Park)","npc":"Kelly","need":"Пройти Into the Woods","steps":["Поговори с Kelly и принеси ей 128× Spruce Log."],"rw":"Kelly's T-Shirt, 1 500 монет, 500 Foraging XP, +5 SkyBlock XP, доступ в Dark Thicket","en":"A Helping Hand"},{"id":"campfire-cult","st":2,"c":"fo","n":"The Campfire Cult","loc":"Dark Thicket, Trials of Fire (The Park)","npc":"Ryan","need":"Пройти A Helping Hand","steps":["Подойди к Ryan крадучись (с зажатым Shift).","Пройди Trial of Fire I: простой в костре 10 секунд.","Поговори с Ryan и принеси 256× Dark Oak Log."],"rw":"Campfire Initiate Badge, 2 000 монет, 1 000 Foraging XP, +5 SkyBlock XP, доступ в Savanna Woodland","en":"The Campfire Cult"},{"id":"campfire-trials","st":0,"c":"fo","n":"The Campfire Trials","loc":"Trials of Fire (The Park)","npc":"Ryan","need":"Пройти The Campfire Cult","steps":["Проходи всё более сложные Trials of Fire, чтобы улучшать Campfire Badge."],"rw":"Улучшения Campfire Badge","en":"The Campfire Trials"},{"id":"the-rebuild","st":2,"c":"fo","n":"The Rebuild","loc":"Savanna Woodland, Melody's Plateau (The Park)","npc":"Worker Xavier, Melody","need":"Пройти The Campfire Cult","steps":["Приди в Savanna Woodland. Worker Xavier заговорит сам и попросит проведать Melody.","Принеси Melody 512× Acacia Log на ремонт арфы."],"rw":"Melody's Shoes, 2 000 монет, 1 500 Foraging XP, +5 SkyBlock XP, доступ к Harp и Jungle Island","en":"The Rebuild"},{"id":"woods-racing","st":0,"c":"fo","n":"Woods Racing","loc":"Spruce Woods, Jungle Island (The Park)","npc":"Gustave","need":"Пройти The Rebuild","steps":["Открой Jungle Island и поговори с Gustave в Spruce Woods.","Гонка начинается рядом с ним и заканчивается на вершине Jungle Island.","Награды за время: быстрее 2 мин — Polished Pebble, 1 мин — Hunter Knife, 32 с — Wolf Paw, 18 с — Silky Lichen и +5 SkyBlock XP."],"rw":"Polished Pebble, Hunter Knife, Wolf Paw, Silky Lichen, +5 SkyBlock XP","en":"Woods Racing"},{"id":"mole-problems","st":2,"c":"fo","n":"Mole Problems","loc":"Jungle Island (The Park)","npc":"Molbert","need":"Пройти The Rebuild","steps":["Поговори с Molbert и принеси ему 512× Jungle Log.","Уйди из зоны и вернись: он попросит поставить три ловушки.","Поговори с ним, снова уйди и вернись. Он застрянет в одной из ловушек, освободи его."],"rw":"Mole Hat, 1 500 монет, 500 Foraging XP, +5 SkyBlock XP, доступ в Moonglade Marsh (с Foraging 12)","en":"Mole Problems"},{"id":"heart-of-the-forest","st":3,"c":"fo","n":"Heart of the Forest","loc":"Tangleburg's Path (Moonglade Marsh)","npc":"Hina","need":"Попасть в Moonglade Marsh (Foraging 12)","steps":["Поговори с Hina на Tangleburg's Path: откроется Heart of the Forest."],"rw":"Доступ к Heart of the Forest","en":"Heart of the Forest"},{"id":"swoops-instructions","st":3,"c":"fo","n":"Swoop's Instructions","loc":"Tangleburg (Moonglade Marsh)","npc":"Swoop","need":"Пройти Heart of the Forest","steps":["Поговори с Swoop в Tangleburg.","Сломай ягоду под ним и сруби Fig Tree.","Он объяснит, как работают Sweep и Tree Gifts."],"rw":"10 000 монет, 5 000 Foraging XP, +5 SkyBlock XP","en":"Swoop's Instructions"},{"id":"davids-hunting","st":3,"c":"fo","n":"David's Hunting Lessons","loc":"Tangleburg, Evergreen Plateau, Fusion House, Murkwater Loch","npc":"David Hunterborough, Auryon, Kysha, Agatha","need":"Пройти Swoop's Instructions","steps":["Поговори с David Hunterborough: он научит основам охоты (Hunting).","Получи и опробуй охотничьи предметы у Auryon, Kysha и Agatha."],"rw":"Знакомство с Hunting","en":"David's Hunting Lessons"},{"id":"time-to-strike","st":1,"c":"c","n":"Time to Strike","loc":"Combat Settlement, Graveyard (Hub), Spider's Den","npc":"Bartender, Haymitch","need":"Побывать в Hub","steps":["Поговори с Bartender в Combat Settlement. Получишь Undead Sword.","Убей 10 Graveyard Zombie или Zombie Villager (+5 SkyBlock XP, 100 Combat XP).","Снова поговори с Bartender (+100 монет) и отправляйся в Spider's Den (+10 Combat XP).","Поговори с Haymitch, зайди в Spider Mound и добудь с мобов 1× String и 1× Spider Eye (+15 Combat XP)."],"rw":"Undead Sword, 100 монет, 125 Combat XP, +5 SkyBlock XP","en":"Time to Strike"},{"id":"flint-bros","st":2,"c":"c","n":"The Flint Bros","loc":"Spider's Den","npc":"Rick","need":"Побывать в Spider's Den","steps":["Поговори с Rick и отдай ему 2× Iron Ingot."],"rw":"Promising Shovel (предмет и рецепт)","en":"The Flint Bros"},{"id":"shaggys-quest","st":2,"c":"c","n":"Shaggy's Quest","loc":"Grandma's House, Arachne's Sanctuary (Spider's Den)","npc":"Shaggy","need":"Побывать в Spider's Den","steps":["Поговори с Shaggy в Grandma's House.","Призови Arachne с помощью 4× Arachne's Calling или Arachne Crystal.","Снова поговори с Shaggy: откроется магазин Arachne Crystal."],"rw":"Магазин Arachne Crystal","note":"Делайте вместе с Arachne's Web: Spider Tamer засчитывает помощь в бою с Arachne.","en":"Shaggy's Quest"},{"id":"arachnes-web","st":2,"c":"c","n":"Arachne's Web","loc":"Arachne's Sanctuary (Spider's Den)","npc":"Spider Tamer","need":"Побывать в Spider's Den","steps":["Поговори с Spider Tamer в Arachne's Sanctuary.","Помоги убить Arachne и снова поговори с ним."],"rw":"10× Spider Essence, доступ в Spider Essence Shop","en":"Arachne's Web"},{"id":"relic-hunting","st":0,"c":"c","n":"Relic Hunting","loc":"Archaeologist's Camp (Spider's Den)","npc":"Archaeologist","need":"Побывать в Spider's Den","steps":["Поговори с Archaeologist. Он даст Archaeologist's Compass, который указывает на ещё не найденные реликвии.","Найди все 28 реликвий, каждая даёт 10 000 монет.","Вернись к Archaeologist за последними 30 000 монет."],"rw":"310 000 монет всего","en":"Relic Hunting"},{"id":"beginning-of-the-end","st":3,"c":"c","n":"Beginning of The End","loc":"The End, Dragon's Nest","npc":"Pearl Dealer","need":"Побывать в The End","steps":["Поговори с Pearl Dealer и добудь 1× End Stone.","Иди в Dragon's Nest и будь там, когда появится Ender Dragon."],"rw":"100 Combat XP","en":"Beginning of The End"},{"id":"end-race","st":0,"c":"c","n":"The End Race","loc":"The End","npc":"Guber","need":"Побывать в The End","steps":["Поговори с Guber и встань на нажимную плиту рядом с ним.","Добеги до плиты на другом конце острова и вернись обратно.","Награды за время: быстрее 3 мин — 8× Silent Pearl, 2 мин — Enderman Mask, 80 с — Nope the Fish, 48 с — Pig's Foot и +5 SkyBlock XP."],"rw":"8× Silent Pearl, Enderman Mask, Nope the Fish, Pig's Foot, +5 SkyBlock XP","en":"The End Race"},{"id":"lone-adventurer","st":3,"c":"c","n":"Talk to Lone Adventurer","loc":"The End","npc":"Lone Adventurer, Pearl Dealer","need":"Побывать в The End; для финала Combat 18","steps":["Поговори с Lone Adventurer и убей 5 Enderman.","Он предложит Void Sword за 200 000 монет. Если откажешься, тот же меч продаёт Rusty.","Он перейдёт к воротам Dragon's Nest. Надень все 8 частей Ender Armor.","Убивай Seer, пока не выпадет Dragon Shortbow, и отнеси лук ему. Потом забери такой же у Pearl Dealer.","На Combat 18 поговори с ним снова: откроется меню статистики Ender Dragon."],"rw":"Возможность купить Void Sword, Dragon Shortbow","en":"Talk to Lone Adventurer"},{"id":"warriors-quest","st":3,"c":"c","n":"Warrior's Quest","loc":"Crimson Isle","npc":"—","need":"Побывать в Spider's Den","steps":["Прокачай Combat до 22 и отправляйся на Crimson Isle."],"rw":"Доступ на Crimson Isle","en":"Warrior's Quest"},{"id":"select-a-faction","st":3,"c":"c","n":"Select a Faction","loc":"Stronghold, Dragontail, Scarleton (Crimson Isle)","npc":"Elle и NPC фракций","need":"Побывать на Crimson Isle","steps":["Поговори с Elle и помоги убить 3 Blaze, которые на неё напали.","В центре Stronghold принеси ей 4× Magma Chunk, 3× Blaze Ashes и 2× Spectre Dust.","Elle появится у Chief's Hut в Dragontail и у Community Center в Scarleton. Поговори с четырьмя NPC каждой фракции.","Выбери фракцию. Дальше квест идёт по ветке магов (Mage) или варваров (Barbarian)."],"rw":"Доступ к фракциям","note":"Фракцию выбирают один раз, и дальше открыта только её ветка квестов. Договоритесь в коопе заранее, кто куда идёт.","en":"Select a Faction"},{"id":"join-mage","st":3,"c":"c","br":"mage","n":"Join the Mage Faction","loc":"Scarleton, Cathedral, Mage Council","npc":"Elle, Dean, Queen Nyx","need":"Пройти Select a Faction и выбрать магов","steps":["Скажи Elle, что вступаешь к магам. Она даст временный Maddox Batphone.","Отдай телефон Dean, он даст Letter of Recommendation.","Отнеси письмо Queen Nyx."],"rw":"Вступление во фракцию Mage","en":"Join the Mage Faction"},{"id":"purchase-abiphone","st":3,"c":"c","br":"mage","n":"Purchase an Abiphone","loc":"Scarleton Bank","npc":"Udel, Dean","need":"Пройти Join the Mage Faction","steps":["Поговори с Udel и купи Abiphone.","Позвони Dean по Abiphone."],"rw":"Контакт Dean в Abiphone","en":"Purchase an Abiphone"},{"id":"recover-lost-research","st":3,"c":"c","br":"mage","n":"Recover Lost Research","loc":"Stronghold, The Bastion, Mage Council","npc":"Elle, Dean, Queen Nyx, Captain Ahone, Counsellor","need":"Пройти Purchase an Abiphone","steps":["Поговори с Elle в Stronghold, она добавит свой контакт в Abiphone.","Проберись в The Bastion и верни украденные исследования.","Позвони Dean и приходи на Mage Council (+100 репутации)."],"rw":"Контакт Elle, +100 репутации","en":"Recover Lost Research"},{"id":"deans-apprentice","st":3,"c":"c","br":"mage","n":"Find the Dean's Apprentice","loc":"Cathedral, Burning Desert","npc":"Dean, Captain Ahone","need":"Пройти Recover Lost Research","steps":["Поговори с Dean в Cathedral: он попросит найти своего Apprentice.","В Burning Desert встретишь Captain Ahone и получишь его контакт.","Найди Apprentice и позвони ему: он прибежит и подлечит тебя зельями.","Вернись к Dean."],"rw":"Контакт Captain Ahone","en":"Find the Dean's Apprentice"},{"id":"help-dean","st":3,"c":"c","br":"mage","n":"Help Dean","loc":"Cathedral, Igrupan's Chicken Coop, Scarleton, Odger's Hut","npc":"Dean, Igrupan, Odexar, Odger","need":"Пройти Find the Dean's Apprentice","steps":["Принеси Dean 10× Magma Chunk и 5× Burning Eye (+150 репутации).","Найди 5 потерявшихся кур Igrupan (+50 репутации).","Возьми у Odexar Volcanic Stonefish для Odger. Тот забракует рыбу, поэтому вылови новый Volcanic Stonefish и отнеси ему.","Отдай Framed Volcanic Stonefish Odexar (+100 репутации, 80 монет).","Принеси Dean Hallowed Skull, Lumino Fiber и Leather Cloth."],"rw":"+300 репутации, 80 монет","en":"Help Dean"},{"id":"recover-sulphur-mage","st":4,"c":"c","br":"mage","n":"Recover Sulphur (маги)","loc":"Forgotten Skull, Kuudra's Hollow","npc":"Captain Ahone, Elle, Ugo, Crag","need":"Пройти Help Dean","steps":["Поговори с Captain Ahone про украденную серу (Sulphur). Начнётся встреча у Forgotten Skull.","Победи Kuudra (+200 репутации).","Поговори с Dean. На этом ветка магов заканчивается."],"rw":"+200 репутации, доступ к боям с Kuudra","en":"Recover Sulphur"},{"id":"join-barbarian","st":3,"c":"c","br":"barb","n":"Join the Barbarian Faction","loc":"Burning Desert, Chief's Hut (Crimson Isle)","npc":"Elle, Ugo, Chief Scorn","need":"Пройти Select a Faction и выбрать варваров","steps":["Скажи Elle, что вступаешь к варварам, и убей Corrupted Flaming Spider в Burning Desert.","Используй выпавшую Sulphur на Ugo.","Проводи их до Chief's Hut, отбиваясь от мобов.","Поговори с Chief Scorn, он примет тебя во фракцию."],"rw":"Вступление во фракцию Barbarian","en":"Join the Barbarian Faction"},{"id":"recover-deans-research","st":3,"c":"c","br":"barb","n":"Recover the Dean's Research","loc":"Dragontail, Cathedral","npc":"Ugo, Elle, Chief Scorn","need":"Пройти Join the Barbarian Faction","steps":["Поговори с Ugo и Elle: нужно украсть исследования у магов.","Elle приведёт тебя в Cathedral. Укради исследования из кабинета Dean.","Поговори с Elle, Ugo и Chief Scorn (+100 репутации)."],"rw":"+100 репутации","en":"Recover the Dean's Research"},{"id":"barbarian-training","st":3,"c":"c","br":"barb","n":"Barbarian Training","loc":"Dojo, Magma Chamber, Dragontail, Burning Desert","npc":"Ugo, Lasea, Odger, Gris","need":"Пройти Recover the Dean's Research","steps":["Выполни для Ugo задания Dojo и победи Magma Boss (+150 репутации).","Помоги Lasea: отдай ей Skeleton Fish и Flyfish и поговори с Odger (+100 репутации).","Поговори с Gris."],"rw":"+250 репутации","en":"Barbarian Training"},{"id":"recover-sulphur-barb-1","st":4,"c":"c","br":"barb","n":"Recover Sulphur (варвары, часть 1)","loc":"Matriarch's Lair","npc":"—","need":"Пройти Barbarian Training","steps":["Добудь Heavy Pearl у The Matriarch в Matriarch's Lair."],"rw":"Heavy Pearl","en":"Recover Sulphur"},{"id":"recover-sulphur-barb-2","st":4,"c":"c","br":"barb","n":"Recover Sulphur (варвары, часть 2)","loc":"Dragontail","npc":"Gris","need":"Пройти часть 1","steps":["Отнеси Heavy Pearl Gris."],"rw":"+150 репутации, 200 000 монет","en":"Recover Sulphur"},{"id":"recover-sulphur-barb-3","st":4,"c":"c","br":"barb","n":"Recover Sulphur (варвары, часть 3)","loc":"Chief's Hut, Forgotten Skull, Kuudra's Hollow","npc":"Chief Scorn, Captain Ahone, Elle, Ugo, Crag","need":"Пройти часть 2","steps":["Поговори с Chief Scorn про украденную серу. Начнётся встреча у Forgotten Skull.","Победи Kuudra (+200 репутации).","Поговори с Chief Scorn (+200 репутации). На этом ветка варваров заканчивается."],"rw":"+400 репутации, доступ к боям с Kuudra","en":"Recover Sulphur"}],"chapters":{"Backwater Bayou":{"key":"bayou","npc":"Jonesy","about":"Рыболовный остров. Открывается квестом Finding the Engine, плыть туда через Ship Navigator.","final":"Pearl of the Swamp: навсегда +1 treasure chance","ch":[{"n":"I","i":"Начало пути по Seven Seas.","done":"Открывает главу II; 4× Treasure Bait; +5 SkyBlock XP","tasks":[{"t":"Узнай про Junk","h":"Junker Joel расскажет, как вылавливать хлам (Junk).","rw":"100 Fishing XP","en":"Learn About Junk"},{"t":"Поставь Rod Part","h":"Roddy ставит на удочки детали (Rod Parts) для настройки.","rw":"100 Fishing XP","en":"Apply a Rod Part"},{"t":"Узнай про хотспоты","h":"Fishing Hotspots дают бонус к статам, и только в них ловятся Hotspot Sea Creatures. Хотспоты есть на многих островах.","rw":"100 Fishing XP","en":"Learn About Hotspots"}]},{"n":"II","i":"Бери удочку и помогай с уборкой: лови хлам!","done":"Открывает главу III; 1 Rusty Coin, 8 Treasure Bait; +10 SkyBlock XP","tasks":[{"t":"Коллекция Lily Pad I","h":"Lily Pad падают с морских существ Bayou. Коллекция открывает новые рецепты.","rw":"250 Fishing XP","en":"Reach Lily Pad Collection I"},{"t":"Поймай Rusty Coin","h":"С Junk Sinker большая часть хлама — Rusty Coin.","rw":"250 Fishing XP","en":"Catch a Rusty Coin"},{"t":"Купи Treasure Bait","h":"Продаёт Junker Joel. Повышает шанс поймать сокровище и хлам.","rw":"250 Fishing XP","en":"Purchase Treasure Bait"},{"t":"Поймай Trash Gobbler","h":"Обычное (Common) морское существо Bayou.","rw":"250 Fishing XP","en":"Catch a Trash Gobbler"},{"t":"Поймай Dumpster Diver","h":"Необычное (Uncommon) существо Bayou, попадается реже Trash Gobbler.","rw":"250 Fishing XP","en":"Catch a Dumpster Diver"}]},{"n":"III","i":"Меняй хлам у Junker Joel на сильные улучшения снаряжения.","done":"Открывает у VI; 2 Busted Belt Buckle, 16 Rusty Coin, 64 Treasure Bait; +25 SkyBlock XP","tasks":[{"t":"Коллекция Lily Pad VII","h":"Lily Pad падают с морских существ Bayou.","rw":"2,500 Fishing XP","en":"Reach Lily Pad Collection VII"},{"t":"Поймай Bayou Sludge","h":"Эпическое (Epic) существо Bayou.","rw":"2,500 Fishing XP","en":"Catch a Bayou Sludge"},{"t":"Поставь Bronze Ship Helm","h":"Крафтится из Bronze Bowl, которые изредка падают с Dumpster Diver.","rw":"2,500 Fishing XP","en":"Apply a Bronze Ship Helm"},{"t":"Поставь Bronze Ship Engine","h":"Купи у Junker Joel и поставь на корабль: откроются дальние рыболовные острова.","rw":"2,500 Fishing XP","en":"Apply a Bronze Ship Engine"},{"t":"Hermit Crab до Rare у Kat","h":"Улучшение питомца у Kat в Hub.","rw":"2,500 Fishing XP","en":"Upgrade Hermit Crab Pet to Rare at Kat"},{"t":"Поставь Speedy Line","h":"Даёт Fishing Speed, клюёт быстрее. Полезна для любой рыбалки.","rw":"2,500 Fishing XP","en":"Apply a Speedy Line to Your Rod"}]},{"n":"VI","i":"Для самых сильных улучшений нужен редкий хлам.","done":"","tasks":[{"t":"Коллекция Lily Pad VIII","h":"Lily Pad падают с морских существ Bayou.","rw":"5,000 Fishing XP","en":"Reach Lily Pad Collection VIII"},{"t":"Поймай Alligator","h":"Легендарное (Legendary) существо Bayou.","rw":"5,000 Fishing XP","en":"Catch an Alligator"},{"t":"Поймай Old Leather Boot","h":"Очень редкий хлам.","rw":"5,000 Fishing XP","en":"Catch an Old Leather Boot"},{"t":"Поставь Bronze Ship Hull","h":"Крафтится из Bronze Bowl и Torn Cloth, они падают с Dumpster Diver и Banshee.","rw":"5,000 Fishing XP","en":"Apply a Bronze Ship Hull"},{"t":"Hermit Crab до Epic у Kat","h":"Улучшение питомца у Kat в Hub.","rw":"5,000 Fishing XP","en":"Upgrade Hermit Crab Pet to Epic at Kat"},{"t":"Купи Junk Artifact","h":"Лучший из Junk-аксессуаров, продаёт Junker Joel.","rw":"5,000 Fishing XP","en":"Purchase a Junk Artifact"}]},{"n":"VII","i":"Закончи с Backwater Bayou и получи Pearl of the Swamp!","done":"","tasks":[{"t":"Колл }
function autosize(ta) { ta.style.height = "auto"; ta.style.height = Math.min(132, Math.max(44, ta.scrollHeight + 12)) + "px"; }
const atEnd = () => innerHeight + scrollY >= document.documentElement.scrollHeight - 160;

/** Retro block transition: tiles over the view shrink away, starting from the hotbar slot that was pressed. */
